name: 同步插件市场镜像

on:
  schedule:
    # 每天 UTC 03:17（北京时间 11:17）从上游重新拉取
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "data/**"

permissions:
  contents: write

concurrency:
  group: build-marketplace
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成镜像清单（注入中文与图标）
        run: python build.py

      - name: 提交变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --staged --quiet; then
            echo "上游没有变化，跳过提交"
          else
            git commit -m "chore: 同步上游市场并注入中文与图标"
            git push
          fi
